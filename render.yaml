services:
  - type: web
    name: prefeitura-digital-backend
    env: python
    region: ohio
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: mysql+pymysql://admin:adminpassword@mysql-db:3306/leopoldina
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: OPENAI_API_KEY
        sync: false

  - type: static
    name: prefeitura-digital-frontend
    env: static
    region: ohio
    plan: free
    publishPath: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: pserv
    name: mysql-db
    env: docker
    dockerContext: .
    dockerfilePath: mysql.Dockerfile
    plan: free
    envVars:
      - key: MYSQL_ROOT_PASSWORD
        value: "rootpassword"
      - key: MYSQL_DATABASE
        value: "leopoldina"
      - key: MYSQL_USER
        value: "admin"
      - key: MYSQL_PASSWORD
        value: "adminpassword"
