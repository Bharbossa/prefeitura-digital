services:
  - type: web
    name: prefeitura-digital-backend
    env: python
    region: ohio
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: prefeitura-digital-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: OPENAI_API_KEY
        sync: false

  - type: static
    name: prefeitura-digital-frontend
    env: static
    region: ohio
    plan: free
    publishPath: frontend
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: prefeitura-digital-db
    type: mysql
    plan: free
    region: ohio
