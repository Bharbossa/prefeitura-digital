<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Leopoldina Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; position: relative; overflow: hidden;">

    <div class="bg-animation-container" id="bg-animation"></div>
    <div class="bg-overlay"></div>

    <div class="form-container fade-in" style="width: 100%; max-width: 400px; margin: 1rem; position: relative; z-index: 10;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="color: var(--primary-color); font-size: 2rem;">
                <i class="fa-solid fa-city"></i> Leopoldina Digital
            </h1>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Acesse sua conta</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" required>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; font-size: 0.9rem;">
                <label style="display: flex; align-items: center; gap: 0.5rem; font-weight: normal;">
                    <input type="checkbox" style="width: auto;"> Lembrar-me
                </label>
                <a href="#">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Entrar</button>
            <p id="errorMsg" style="color: var(--error); margin-top: 1rem; text-align: center; display: none;"></p>
        </form>
        
        <div style="text-align: center; margin-top: 2rem; color: var(--text-secondary);">
            Ainda não tem conta? <a href="register.html">Cadastre-se</a>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        initBackgroundAnimation('bg-animation');

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            try {
                const formData = new URLSearchParams();
                formData.append('username', email);
                formData.append('password', password);

                const response = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('access_token', data.access_token);
                    
                    // Fetch user info based on token
                    const userRes = await fetch(`${API_URL}/auth/me`, {
                        headers: { 'Authorization': `Bearer ${data.access_token}` }
                    });
                    
                    if(userRes.ok) {
                        const userData = await userRes.json();
                        localStorage.setItem('user_info', JSON.stringify(userData));
                        if(userData.tipo_usuario === 'admin') {
                            window.location.href = 'admin.html';
                        } else {
                            window.location.href = 'dashboard.html';
                        }
                    }
                } else {
                    const errorData = await response.json();
                    errorMsg.innerText = errorData.detail || "Credenciais inválidas.";
                    errorMsg.style.display = "block";
                }
            } catch (err) {
                errorMsg.innerText = `Erro de Conexão/CORS. Verifique se a API backend está respondendo. Detalhe: ${err.message}`;
                errorMsg.style.display = "block";
            }
        });
    </script>

    <footer class="footer">
        <p>Todos direitos reservados ao Desenvolvedor Barbosa Nunes</p>
    </footer>
</body>
</html>
