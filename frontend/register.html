<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Colônia Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3a8a">
</head>

<body style="display: flex; flex-direction: column; min-height: 100vh; position: relative; overflow-x: hidden;">

    <nav class="navbar" style="width: 100%;">
        <div class="logo">
            <i class="fa-solid fa-city"></i>
            Colônia Digital
        </div>
        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="nav-links" id="nav-links">
            <a href="index.html" class="btn btn-outline" style="margin-right: 1rem;">Início</a>
            <a href="login.html" class="btn btn-outline" style="margin-right: 1rem;">Entrar</a>
            <a href="register.html" class="btn btn-primary">Cadastrar</a>
            <div class="theme-switch-wrapper">
                <label class="theme-switch" for="checkbox">
                    <input type="checkbox" id="checkbox" />
                    <div class="slider round"></div>
                </label>
            </div>
        </div>
    </nav>

    <div class="bg-animation-container" id="bg-animation"></div>
    <div class="bg-overlay"></div>

    <div class="form-container fade-in"
        style="width: 100%; max-width: 500px; margin: auto; position: relative; z-index: 10;">
        
        <div style="text-align: center; margin-bottom: 2rem;">
            <h1 style="color: var(--primary-color); font-size: 2rem;">Crie sua Conta</h1>
            <p style="color: var(--text-secondary); margin-top: 0.5rem;">Preencha os dados abaixo</p>
        </div>

        <form id="registerForm">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" required>
            </div>

            <div class="form-group">
                <label for="cpf">CPF</label>
                <input type="text" id="cpf" required placeholder="Apenas números">
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required>
            </div>

            <div class="form-group" style="display: flex; gap: 1rem;">
                <div style="flex: 1;">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" required>
                </div>
                <div style="flex: 1;">
                    <label for="whatsapp">WhatsApp</label>
                    <input type="text" id="whatsapp" required>
                </div>
            </div>

            <div class="form-group">
                <label for="genero">Gênero</label>
                <select id="genero" class="btn btn-outline" style="width: 100%; text-align: left;" required>
                    <option value="" disabled selected>Selecione seu gênero</option>
                    <option value="Feminino">Feminino</option>
                    <option value="Masculino">Masculino</option>
                    <option value="Outro">Outro</option>
                    <option value="Prefiro não informar">Prefiro não informar</option>
                </select>
            </div>

            <div class="form-group" style="display: flex; gap: 1rem; flex-wrap: wrap;">
                <div style="flex: 1; min-width: 200px;">
                    <label for="endereco">Rua / Logradouro</label>
                    <input type="text" id="endereco" required placeholder="Ex: Rua Teódulo Augusto, nº 100">
                </div>
                <div style="flex: 1; min-width: 200px;">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" required placeholder="Ex: Belo Jardim">
                </div>
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" required placeholder="Sua senha secreta">
                <small style="color: var(--text-secondary); display: block; margin-top: 6px; font-size: 0.8rem; line-height: 1.4;">
                    🔒 A senha deve ter no mínimo <strong>8 dígitos</strong>, 1 <strong>letra maiúscula</strong>, 1 <strong>número</strong> e 1 <strong>caractere especial (!*#$)</strong>.
                </small>
            </div>

            <div class="form-group"
                style="margin-top: 1.5rem; background: rgba(0,0,0,0.02); padding: 1rem; border-radius: 8px; border: 1px solid var(--border);">
                <div style="display: flex; gap: 0.8rem; align-items: flex-start;">
                    <input type="checkbox" id="lgpd_consent" required
                        style="width: 20px; height: 20px; margin-top: 2px;">
                    <label for="lgpd_consent"
                        style="font-size: 0.85rem; line-height: 1.4; color: var(--text-secondary);">
                        Eu aceito o tratamento dos meus dados pessoais conforme a <strong>LGPD</strong> e li a <a
                            href="privacidade.html" target="_blank"
                            style="color: var(--primary-color); font-weight: 600;">Política de Privacidade</a>.
                    </label>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Cadastrar</button>
            <p id="errorMsg" style="color: var(--error); margin-top: 1rem; text-align: center; display: none;"></p>
        </form>

        <div style="text-align: center; margin-top: 2rem; color: var(--text-secondary);">
            Já tem uma conta? <a href="login.html">Faça Login</a>
        </div>
    </div>

    <script src="js/main.js?v=1.0.7"></script>
    <script>
        initBackgroundAnimation('bg-animation');

        document.getElementById('registerForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.style.display = 'none';

            const senha = document.getElementById('senha').value;
            if (senha.length < 8) {
                errorMsg.innerText = 'A senha deve ter no mínimo 8 dígitos.';
                errorMsg.style.display = 'block';
                return;
            }
            if (!/[A-Z]/.test(senha)) {
                errorMsg.innerText = 'A senha deve conter pelo menos uma letra maiúscula.';
                errorMsg.style.display = 'block';
                return;
            }
            if (!/[0-9]/.test(senha)) {
                errorMsg.innerText = 'A senha deve conter pelo menos um número.';
                errorMsg.style.display = 'block';
                return;
            }
            if (!/[!*#$@%^&+=?_\-\W]/.test(senha)) {
                errorMsg.innerText = 'A senha deve conter pelo menos um caractere especial (!*#$).';
                errorMsg.style.display = 'block';
                return;
            }

            const rua = document.getElementById('endereco').value.trim();
            const bairro = document.getElementById('bairro').value.trim();
            const fullAddress = (rua && bairro) ? `${rua}, ${bairro}` : (rua || bairro);

            const data = {
                nome: document.getElementById('nome').value.trim(),
                cpf: document.getElementById('cpf').value.trim(),
                email: document.getElementById('email').value.trim(),
                telefone: document.getElementById('telefone').value.trim(),
                whatsapp: document.getElementById('whatsapp').value.trim(),
                endereco: fullAddress,
                genero: document.getElementById('genero').value,
                senha: senha
            };

            const errorMsg = document.getElementById('errorMsg');

            try {
                const response = await fetch(`${API_URL}/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    alert('Cadastro realizado com sucesso! Sua conta agora passará por uma análise administrativa. Você poderá fazer login assim que for aprovado.');
                    window.location.href = 'login.html';
                } else {
                    const errorData = await response.json();
                    errorMsg.innerText = errorData.detail || "Erro no cadastro.";
                    errorMsg.style.display = "block";
                }
            } catch (err) {
                errorMsg.innerText = "Erro ao conectar ao servidor.";
                errorMsg.style.display = "block";
            }
        });
    </script>

    <footer class="footer">
        <p>Desenvolvido por Barbosa Nunes</p>
        <p style="font-size: 0.8rem; margin-top: 0.5rem; opacity: 0.8;">
            <i class="fa-solid fa-shield-halved"></i> Dados protegidos pela <strong>LGPD</strong>. <a
                href="privacidade.html" style="color: inherit; text-decoration: underline;">Saiba mais</a>.
        </p>
    </footer>
</body>

</html>
