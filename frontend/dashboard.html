<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Cidadão - Colônia Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-animation-container" id="bg-animation"></div>

    <nav class="navbar">
        <div class="logo">
            <a href="index.html" style="color: inherit;"><i class="fa-solid fa-city"></i> Colônia Digital</a>
        </div>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="nav-links" id="nav-links">
            <!-- Populated via JS -->
        </div>
    </nav>

    <div class="dashboard-container fade-in">
        <div style="display: flex; gap: 2rem; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 300px;">
                <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 2rem;">
                    <h2 style="color: var(--primary-color);">Minhas Ocorrências</h2>
                    <select id="filtroOcorrencias" onchange="loadOcorrencias()" style="padding: 0.5rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary);">
                        <option value="">Todas</option>
                        <option value="Pendente">Pendentes</option>
                        <option value="Em atendimento">Em Atendimento</option>
                        <option value="Resolvido">Resolvidas</option>
                    </select>
                </div>
                <button class="btn btn-primary" style="margin-bottom: 2rem;" onclick="document.getElementById('modalNovaOcorrencia').style.display='block'">
                    <i class="fa-solid fa-plus"></i> Registrar Problema
                </button>
                <div class="ocorrencias-list" id="listaOcorrencias"></div>
            </div>

            <div style="flex: 1; min-width: 300px;">
                <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 2rem;">
                    <h2 style="color: var(--primary-color);">Meus Agendamentos</h2>
                    <select id="filtroAgendamentos" onchange="loadAgendamentos()" style="padding: 0.5rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-primary);">
                        <option value="">Todos</option>
                        <option value="Pendente">Pendentes</option>
                        <option value="Confirmado">Confirmados</option>
                        <option value="Cancelado">Cancelados</option>
                    </select>
                </div>
                <div style="display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap;">
                    <button class="btn btn-primary" style="background: var(--success); flex: 1; min-width: 140px;" onclick="abrirModalConsulta()">
                        <i class="fa-solid fa-user-doctor"></i> Consulta
                    </button>
                    <button class="btn btn-primary" style="background: var(--accent); flex: 1; min-width: 140px;" onclick="abrirModalAtendimento()">
                        <i class="fa-solid fa-users"></i> Atendimento
                    </button>
                    <button class="btn btn-primary" style="background: var(--primary-color); flex: 1; min-width: 140px;" onclick="abrirModalViagem()">
                        <i class="fa-solid fa-bus"></i> Viagem
                    </button>
                </div>
                <div class="ocorrencias-list" id="listaAgendamentos"></div>
            </div>
        </div>
    </div>

    <!-- Modal Nova Ocorrencia -->
    <div id="modalNovaOcorrencia" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1001;">
        <div class="form-container fade-in" style="margin-top: 5rem; position: relative;">
            <i class="fa-solid fa-times" style="position: absolute; right: 20px; top: 20px; cursor: pointer; font-size: 1.5rem;" onclick="document.getElementById('modalNovaOcorrencia').style.display='none'"></i>
            <h3 style="margin-bottom: 1.5rem;">Registrar Problema</h3>
            <form id="formOcorrencia">
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" id="oc_titulo" required>
                </div>
                <div class="form-group">
                    <label>Secretaria Responsável</label>
                    <select id="oc_secretaria" required>
                        <option value="">Carregando...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Descrição Detalhada</label>
                    <textarea id="oc_descricao" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label>Foto (Opcional)</label>
                    <input type="file" id="oc_foto" accept="image/*">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Enviar</button>
            </form>
        </div>
    </div>

    <!-- Modal Novo Agendamento -->
    <div id="modalNovoAgendamento" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1001; overflow-y:auto;">
        <div class="form-container fade-in" style="margin-top: 5rem; margin-bottom: 5rem; position: relative;">
            <i class="fa-solid fa-times" style="position: absolute; right: 20px; top: 20px; cursor: pointer; font-size: 1.5rem;" onclick="document.getElementById('modalNovoAgendamento').style.display='none'"></i>
            <h3 id="modalAgTitle" style="margin-bottom: 1.5rem;">Agendamento</h3>
            <form id="formAgendamento">
                <div class="form-group">
                    <label>Secretaria (Destino do Agendamento)</label>
                    <select id="ag_secretaria" required>
                        <option value="">Carregando...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tipo de Atendimento</label>
                    <select id="ag_tipo" required>
                        <option value="">Selecione...</option>
                        <option value="Consulta Presencial">Consulta Presencial</option>
                    </select>
                </div>
                <div class="form-group" id="group_posto" style="display: none;">
                    <label>Posto de Saúde</label>
                    <select id="ag_posto">
                        <option value="">Selecione o posto...</option>
                        <option value="POSTO JOSÉ LUIZ LESSA (PSF 01)">POSTO JOSÉ LUIZ LESSA (PSF 01)</option>
                        <option value="POSTO CENTRO (PSF 02)">POSTO CENTRO (PSF 02)</option>
                        <option value="POSTO VILA NOVA (PSF 03)">POSTO VILA NOVA (PSF 03)</option>
                        <option value="POSTO DANIEL MONTEIRO DA CRUZ (PSF 04)">POSTO DANIEL MONTEIRO DA CRUZ (PSF 04)</option>
                        <option value="POSTO DE SAÚDE USINA TAQUARA (PSF 05)">POSTO DE SAÚDE USINA TAQUARA (PSF 05)</option>
                        <option value="POSTO BELO JARDIM (PSF 06)">POSTO BELO JARDIM (PSF 06)</option>
                        <option value="POSTO JOSÉ ADAMOR COSTA (PSF 07)">POSTO JOSÉ ADAMOR COSTA (PSF 07)</option>
                        <option value="POSTO JOSÉ ACIOLY MACIEL (PSF 08)">POSTO JOSÉ ACIOLY MACIEL (PSF 08)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="ag_assunto_label">Assunto</label>
                    <input type="text" id="ag_assunto" placeholder="" required>
                </div>
                <div class="form-group">
                    <label>Data Desejada</label>
                    <input type="date" id="ag_data_date" required>
                </div>
                <div class="form-group">
                    <label>Horário (atendimento das 08:00 às 12:00)</label>
                    <input type="time" id="ag_data_time" required min="08:00" max="12:00">
                </div>
                <div class="form-group" id="group_sus" style="display: none;">
                    <label>Número do Cartão SUS</label>
                    <input type="text" id="ag_cartao_sus" placeholder="000 0000 0000 0000" maxlength="20">
                </div>
                <div class="form-group" id="group_motivo" style="display: none;">
                    <label>Motivo da Viagem (Ex: Consulta, Exame, Cirurgia, etc)</label>
                    <textarea id="ag_motivo" rows="3"></textarea>
                </div>
                <div class="form-group" id="group_acompanhante" style="display: none;">
                    <label>Nome do Acompanhante (Se houver)</label>
                    <input type="text" id="ag_acompanhante" placeholder="Ex: Maria José">
                </div>
                <div class="form-group" id="group_comprovante" style="display: none;">
                    <label>Comprovante da Viagem (Consulta, Exame, etc)</label>
                    <input type="file" id="ag_comprovante" accept="image/*,application/pdf">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; background: var(--success);">Confirmar Agendamento</button>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        if (!checkAuth()) throw new Error("Acesso negado");

        function abrirModalConsulta() {
            document.getElementById('modalNovoAgendamento').style.display = 'block';
            document.getElementById('modalAgTitle').innerText = 'Marcar Consulta (Saúde)';
            
            const tipoSelect = document.getElementById('ag_tipo');
            tipoSelect.innerHTML = `<option value="Consulta Presencial">Consulta Presencial</option>`;
            tipoSelect.value = "Consulta Presencial";
            
            document.getElementById('group_sus').style.display = 'block';
            document.getElementById('ag_cartao_sus').required = true;
            document.getElementById('ag_assunto').required = true;
            document.getElementById('ag_data_date').required = true;
            document.getElementById('ag_data_time').required = true;

            const secSelect = document.getElementById('ag_secretaria');
            for(let i=0; i<secSelect.options.length; i++) {
                if(secSelect.options[i].text.toUpperCase().includes("SAÚDE")) {
                    secSelect.options[i].style.display = 'block';
                    secSelect.selectedIndex = i;
                } else {
                    secSelect.options[i].style.display = 'none';
                }
            }
            secSelect.disabled = true; // Força para a Secretaria de Saúde

            document.getElementById('ag_assunto_label').innerText = 'Assunto (Qual médico deseja agendar? E o Motivo?)';
            document.getElementById('ag_assunto').placeholder = 'Ex: Consulta com Clínico Geral, Pediatra, etc.';
            
            document.getElementById('group_posto').style.display = 'block';
            document.getElementById('ag_posto').required = true;
            document.getElementById('group_motivo').style.display = 'none';
            document.getElementById('group_acompanhante').style.display = 'none';
            document.getElementById('group_comprovante').style.display = 'none';
            document.getElementById('ag_comprovante').required = false;
        }

        function toggleSusField() {
            const secSelect = document.getElementById('ag_secretaria');
            const selectedText = secSelect.options[secSelect.selectedIndex]?.text || '';
            const tipo = document.getElementById('ag_tipo').value;
            
            const isSaude = selectedText.toUpperCase().includes('SAÚDE') || tipo === 'Consulta Presencial';
            const susGroup = document.getElementById('group_sus');
            const susInput = document.getElementById('ag_cartao_sus');

            if (isSaude) {
                susGroup.style.display = 'block';
                susInput.required = true;
            } else {
                susGroup.style.display = 'none';
                susInput.required = false;
                susInput.value = '';
            }
        }

        document.getElementById('ag_secretaria').addEventListener('change', toggleSusField);
        document.getElementById('ag_tipo').addEventListener('change', toggleSusField);

        function abrirModalAtendimento() {
            document.getElementById('modalNovoAgendamento').style.display = 'block';
            document.getElementById('modalAgTitle').innerText = 'Agendar Atendimento Presencial';
            
            const tipoSelect = document.getElementById('ag_tipo');
            tipoSelect.innerHTML = `
                <option value="">Selecione...</option>
                <option value="Atendimento Presencial">Atendimento Presencial</option>
            `;

            const secSelect = document.getElementById('ag_secretaria');
            secSelect.disabled = false;
            for(let i=0; i<secSelect.options.length; i++) {
                secSelect.options[i].style.display = 'block';
            }
            secSelect.value = "";

            document.getElementById('ag_assunto_label').innerText = 'Assunto (Para qual assunto/secretário deseja agendar?)';
            document.getElementById('ag_assunto').placeholder = 'Ex: Reunião sobre alvará, Falar com Secretário de Obras, etc.';
            
            document.getElementById('group_posto').style.display = 'none';
            document.getElementById('ag_posto').required = false;
            document.getElementById('group_motivo').style.display = 'none';
            document.getElementById('group_acompanhante').style.display = 'none';
            document.getElementById('group_comprovante').style.display = 'none';
            document.getElementById('ag_comprovante').required = false;
        }

        function abrirModalViagem() {
            document.getElementById('modalNovoAgendamento').style.display = 'block';
            document.getElementById('modalAgTitle').innerText = 'Marcação de Viagem (Garagem Municipal)';
            
            const tipoSelect = document.getElementById('ag_tipo');
            tipoSelect.innerHTML = `<option value="Marcação de Viagem">Marcação de Viagem</option>`;
            tipoSelect.value = "Marcação de Viagem";

            const secSelect = document.getElementById('ag_secretaria');
            for(let i=0; i<secSelect.options.length; i++) {
                if(secSelect.options[i].text.toUpperCase().includes("GARAGEM MUNICIPAL")) {
                    secSelect.options[i].style.display = 'block';
                    secSelect.selectedIndex = i;
                } else {
                    secSelect.options[i].style.display = 'none';
                }
            }
            secSelect.disabled = true; // Força para a Garagem Municipal

            document.getElementById('ag_assunto_label').innerText = 'Destino da Viagem';
            document.getElementById('ag_assunto').placeholder = 'Ex: Juiz de Fora, Belo Horizonte, etc.';
            
            document.getElementById('group_posto').style.display = 'none';
            document.getElementById('ag_posto').required = false;
            document.getElementById('group_motivo').style.display = 'block';
            document.getElementById('ag_motivo').required = true;
            document.getElementById('group_acompanhante').style.display = 'block';
            document.getElementById('group_comprovante').style.display = 'block';
            document.getElementById('ag_comprovante').required = true;
        }

        async function loadSecretarias() {
            try {
                const res = await fetch(`${API_URL}/secretarias`);
                if(res.ok) {
                    const secs = await res.json();
                    const select = document.getElementById('oc_secretaria');
                    const selectAg = document.getElementById('ag_secretaria');
                    select.innerHTML = '<option value="">Selecione...</option>';
                    if(selectAg) selectAg.innerHTML = '<option value="">Selecione...</option>';
                    secs.forEach(s => {
                        select.innerHTML += `<option value="${s.id}">${s.nome}</option>`;
                        if(selectAg) selectAg.innerHTML += `<option value="${s.id}">${s.nome}</option>`;
                    });
                }
            } catch(e) {}
        }
           async function loadOcorrencias() {
            try {
                const res = await fetch(`${API_URL}/ocorrencias/user`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if(res.ok) {
                    let data = await res.json();
                    
                    // Client-side filtering
                    const filtro = document.getElementById('filtroOcorrencias').value;
                    if (filtro) data = data.filter(o => o.status === filtro);

                    const container = document.getElementById('listaOcorrencias');
                    container.innerHTML = '';
                    if(data.length === 0) {
                        container.innerHTML = `<p style="padding: 1rem; color: var(--text-muted);">Nenhuma ocorrência encontrada ${filtro ? 'com status: ' + filtro : ''}.</p>`;
                        return;
                    }
                    data.forEach(o => {
                        const statusClass = {
                            'pendente': 'status-pendente',
                            'em_atendimento': 'status-atendimento',
                            'resolvido': 'status-resolvida'
                        }[o.status.toLowerCase()] || 'status-pendente';

                        container.innerHTML += `
                            <div class="ocorrencia-card">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
                                    <h3><i class="fa-solid fa-triangle-exclamation"></i> ${o.titulo}</h3>
                                    ${o.status === 'Resolvido' ? `
                                        <button onclick="gerarProtocolo('${o.id}')" class="btn btn-primary" style="font-size: 0.75rem; padding: 0.3rem 0.6rem; background: var(--success);">
                                            <i class="fa-solid fa-print"></i> Protocolo
                                        </button>
                                    ` : ''}
                                </div>
                                <p style="color: var(--text-secondary); margin-bottom: 1rem;">${o.descricao}</p>
                                <span class="status-badge ${statusClass}">${o.status}</span>
                                ${o.foto ? `<p style="margin-top: 1rem;"><a href="${MEDIA_URL}/${o.foto}" target="_blank" class="btn btn-outline" style="font-size: 0.8rem; padding: 0.4rem 1rem;"><i class="fa-solid fa-image"></i> Ver Foto</a></p>` : ''}
                            </div>
                        `;
                    });
                }
            } catch(e) { console.error(e); }
        }

        async function loadAgendamentos() {
            try {
                const res = await fetch(`${API_URL}/agendamentos/user`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if(res.ok) {
                    let data = await res.json();
                    
                    const filtro = document.getElementById('filtroAgendamentos').value;
                    if (filtro) data = data.filter(a => a.status === filtro);

                    const container = document.getElementById('listaAgendamentos');
                    container.innerHTML = '';
                    if(data.length === 0) {
                        container.innerHTML = `<p style="padding: 1rem; color: var(--text-muted);">Nenhum agendamento encontrado ${filtro ? 'com status: ' + filtro : ''}.</p>`;
                        return;
                    }
                    data.forEach(a => {
                        const statusClass = {
                            'pendente': 'status-pendente',
                            'confirmado': 'status-confirmado',
                            'cancelado': 'status-error'
                        }[a.status.toLowerCase()] || 'status-pendente';

                        container.innerHTML += `
                            <div class="ocorrencia-card" style="border-left: 5px solid var(--success);">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
                                    <h3><i class="fa-solid fa-calendar"></i> ${a.assunto}</h3>
                                    ${a.status === 'Confirmado' ? `
                                        <button onclick="gerarProtocoloAgendamento('${a.id}')" class="btn btn-primary" style="font-size: 0.75rem; padding: 0.3rem 0.6rem; background: var(--primary-color);">
                                            <i class="fa-solid fa-print"></i> Protocolo
                                        </button>
                                    ` : ''}
                                </div>
                                <p style="color: var(--text-secondary); margin-bottom: 0.5rem;"><i class="fa-solid fa-laptop-medical"></i> Tipo: <strong>${a.tipo}</strong></p>
                                ${a.cartao_sus ? `<p style="margin-bottom: 0.5rem;"><strong>Cartão SUS:</strong> ${a.cartao_sus}</p>` : ''}
                                <p style="color: var(--text-secondary); margin-bottom: 1rem;"><i class="fa-regular fa-clock"></i> Para: ${new Date(a.data_hora).toLocaleString()}</p>
                                <span class="status-badge ${statusClass}">${a.status}</span>
                            </div>
                        `;
                    });
                }
            } catch(e) { console.error(e); }
        }

        document.getElementById('formOcorrencia').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('titulo', document.getElementById('oc_titulo').value);
            formData.append('descricao', document.getElementById('oc_descricao').value);
            formData.append('secretaria_id', document.getElementById('oc_secretaria').value);
            
            const fileInput = document.getElementById('oc_foto');
            if(fileInput.files.length > 0) {
                formData.append('foto', fileInput.files[0]);
            }

            try {
                const res = await fetch(`${API_URL}/ocorrencias`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getToken()}` },
                    body: formData
                });
                if(res.ok) {
                    alert('Ocorrência registrada!');
                    document.getElementById('modalNovaOcorrencia').style.display='none';
                    e.target.reset();
                    loadOcorrencias();
                } else {
                    alert('Erro ao registrar.');
                }
            } catch(e) { alert('Erro de conexao.'); }
        });

        document.getElementById('formAgendamento').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const dropdown = document.getElementById('ag_secretaria');
            const nomeSecretaria = dropdown.options[dropdown.selectedIndex].text;
            const tipoAtend = document.getElementById('ag_tipo').value;
            const dataDate = document.getElementById('ag_data_date').value;
            const dataTime = document.getElementById('ag_data_time').value;
            
            if (!dataDate || !dataTime) {
                alert("Selecione data e hora.");
                return;
            }

            const dataObjeto = new Date(`${dataDate}T${dataTime}`);
            
            let assuntoFinal = document.getElementById('ag_assunto').value;
            if (document.getElementById('group_posto').style.display !== 'none') {
                const posto = document.getElementById('ag_posto').value;
                if (!posto) {
                    alert("Selecione um Posto de Saúde.");
                    return;
                }
                assuntoFinal = `[${posto}] ` + assuntoFinal;
            }

            if (tipoAtend === "Marcação de Viagem") {
                const formData = new FormData();
                formData.append('secretaria_id', parseInt(dropdown.value));
                formData.append('tipo', tipoAtend);
                formData.append('assunto', assuntoFinal);
                formData.append('motivo', document.getElementById('ag_motivo').value);
                formData.append('acompanhante', document.getElementById('ag_acompanhante').value);
                formData.append('data_hora', dataObjeto.toISOString());
                formData.append('cartao_sus', '');
                
                const fileInput = document.getElementById('ag_comprovante');
                if(fileInput.files.length > 0) {
                    formData.append('comprovante', fileInput.files[0]);
                }

                try {
                    const res = await fetch(`${API_URL}/agendamentos/viagem`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${getToken()}` },
                        body: formData
                    });
                    if(res.ok) {
                        alert('Viagem agendada com sucesso! Aguarde a confirmação da Garagem.');
                        document.getElementById('modalNovoAgendamento').style.display='none';
                        e.target.reset();
                        loadAgendamentos();
                    } else {
                        alert('Erro ao agendar viagem.');
                    }
                } catch(e) { alert('Erro de conexao.'); }
            } else {
                const data = {
                    secretaria_id: parseInt(dropdown.value),
                    tipo: tipoAtend,
                    assunto: assuntoFinal,
                    motivo: null,
                    acompanhante: null,
                    data_hora: dataObjeto.toISOString(),
                    cartao_sus: document.getElementById('ag_cartao_sus').value
                };

                try {
                    const res = await fetch(`${API_URL}/agendamentos`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
                        body: JSON.stringify(data)
                    });
                    if(res.ok) {
                        alert('Agendamento solicitado com sucesso! Aguarde a confirmação da secretaria.');
                        document.getElementById('modalNovoAgendamento').style.display='none';
                        e.target.reset();
                    loadAgendamentos();
                    } else {
                        alert('Erro ao agendar.');
                    }
                } catch(e) { alert('Erro de conexao.'); }
            }
        });

         async function gerarProtocolo(id) {
            try {
                const res = await fetch(`${API_URL}/ocorrencias/user`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if(res.ok) {
                    const data = await res.json();
                    const o = data.find(i => i.id == id);
                    if (!o) return;

                    const printWindow = window.open('', '_blank');
                    printWindow.document.write(`
                        <html>
                        <head>
                            <title>Protocolo Colônia Digital - ${o.protocolo || o.id}</title>
                            <style>
                                body { font-family: 'Inter', sans-serif; padding: 40px; line-height: 1.6; color: #1e293b; }
                                .header { text-align: center; margin-bottom: 40px; border-bottom: 4px solid #2563eb; padding-bottom: 20px; }
                                .content { background: #f8fafc; padding: 30px; border-radius: 12px; border: 1px solid #e2e8f0; }
                                .row { display: flex; margin-bottom: 15px; }
                                .label { width: 140px; font-weight: 700; color: #64748b; }
                                .stamp { margin-top: 40px; text-align: right; }
                                .badge { padding: 10px 20px; border: 2px solid #10b981; color: #10b981; font-weight: 800; border-radius: 8px; display: inline-block; transform: rotate(-5deg); }
                                @media print { .no-print { display: none; } }
                            </style>
                        </head>
                        <body>
                            <div class="header">
                                <h1>📌 CERTIFICADO DE CONCLUSÃO</h1>
                                <p>Colônia Digital</p>
                            </div>
                            <div class="content">
                                <div class="row"><span class="label">PROTOCOLO:</span> <strong>${o.protocolo || o.id}</strong></div>
                                <div class="row"><span class="label">ASSUNTO:</span> ${o.titulo}</div>
                                <div class="row"><span class="label">DATA:</span> ${new Date(o.data).toLocaleString()}</div>
                                <div class="row"><span class="label">SITUAÇÃO:</span> RESOLVIDO</div>
                                <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 20px 0;">
                                <div>
                                    <span class="label">RESPOSTA ADM:</span>

                            </div>
                        </body>
                        </html>
                    `);
                    printWindow.document.close();
                }
            } catch(e) { alert("Erro ao gerar protocolo."); }
        }

        async function gerarProtocoloAgendamento(id) {
            try {
                const res = await fetch(`${API_URL}/agendamentos/user`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if(res.ok) {
                    const data = await res.json();
                    const a = data.find(i => i.id == id);
                    if (!a) return;

                    const printWindow = window.open('', '_blank');
                    printWindow.document.write(`
                        <html>
                        <head>
                            <title>Comprovante de Agendamento - ${a.protocolo || a.id}</title>
                            <style>
                                body { font-family: 'Inter', sans-serif; padding: 40px; line-height: 1.6; color: #1e293b; }
                                .header { text-align: center; margin-bottom: 40px; border-bottom: 4px solid #10b981; padding-bottom: 20px; }
                                .content { background: #f0fdf4; padding: 30px; border-radius: 12px; border: 1px solid #dcfce7; }
                                .row { display: flex; margin-bottom: 15px; }
                                .label { width: 140px; font-weight: 700; color: #166534; }
                                .stamp { margin-top: 40px; text-align: right; }
                                .badge { padding: 10px 20px; border: 2px solid #2563eb; color: #2563eb; font-weight: 800; border-radius: 8px; display: inline-block; transform: rotate(-5deg); }
                                @media print { .no-print { display: none; } }
                            </style>
                        </head>
                        <body>
                            <div class="header">
                                <h1>📅 COMPROVANTE DE AGENDAMENTO</h1>
                                <p>Colônia Digital</p>
                            </div>
                            <div class="content">
                                <div class="row"><span class="label">PROTOCOLO:</span> <strong>${a.protocolo || a.id}</strong></div>
                                <div class="row"><span class="label">ASSUNTO:</span> ${a.assunto}</div>
                                <div class="row"><span class="label">DATA/HORA:</span> ${new Date(a.data_hora).toLocaleString()}</div>
                                <div class="row"><span class="label">SITUAÇÃO:</span> CONFIRMADO</div>
                                <div class="row"><span class="label">TIPO:</span> ${a.tipo}</div>
                                ${a.cartao_sus ? `<div class="row"><span class="label">SUS:</span> ${a.cartao_sus}</div>` : ''}
                            </div>
                            <div class="stamp"><div class="badge">AGENDAMENTO VÁLIDO</div></div>
                            <div style="text-align: center; margin-top: 40px;">
                                <button onclick="window.print()" class="no-print" style="padding: 10px 30px; background: #10b981; color: white; border: none; border-radius: 6px; cursor: pointer;">Imprimir Comprovante</button>
                            </div>
                        </body>
                        </html>
                    `);
                    printWindow.document.close();
                }
            } catch(e) { alert("Erro ao imprimir."); }
        }

        loadSecretarias();
        async function init() {
            await loadSecretarias();
            await loadOcorrencias();
            await loadAgendamentos();
            initBackgroundAnimation('bg-animation');
            
            // Atendimento em tempo real: Atualiza as listas a cada 60 segundos
            if (!window.dashboardInterval) {
                window.dashboardInterval = setInterval(async () => {
                    console.log('Atualizando dados do painel...');
                    await loadOcorrencias();
                    await loadAgendamentos();
                }, 60000);
            }
        }
        init();
    </script>

    <footer class="footer">
        <p>Todos direitos reservados ao Desenvolvedor Barbosa Nunes</p>
    </footer>
</body>
</html>
