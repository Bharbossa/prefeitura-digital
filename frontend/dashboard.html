<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Cidadão - Leopoldina Digital</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="bg-animation-container" id="bg-animation"></div>

    <nav class="navbar">
        <div class="logo">
            <a href="index.html" style="color: inherit;"><i class="fa-solid fa-city"></i> Leopoldina</a>
        </div>
        <div class="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <div class="nav-links" id="nav-links">
            <!-- Populated via JS -->
        </div>
    </nav>

    <div class="dashboard-container fade-in">
        <div style="display: flex; gap: 2rem; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 300px;">
                <h2 style="margin-bottom: 2rem; color: var(--primary-color);">Minhas Ocorrências</h2>
                <button class="btn btn-primary" style="margin-bottom: 2rem;" onclick="document.getElementById('modalNovaOcorrencia').style.display='block'">
                    <i class="fa-solid fa-plus"></i> Nova Ocorrência
                </button>
                <div class="ocorrencias-list" id="listaOcorrencias"></div>
            </div>

            <div style="flex: 1; min-width: 300px;">
                <h2 style="margin-bottom: 2rem; color: var(--primary-color);">Meus Agendamentos</h2>
                <div style="display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap;">
                    <button class="btn btn-primary" style="background: var(--success); flex: 1; min-width: 140px;" onclick="abrirModalConsulta()">
                        <i class="fa-solid fa-user-doctor"></i> Marcar Consulta
                    </button>
                    <button class="btn btn-primary" style="background: var(--accent); flex: 1; min-width: 140px;" onclick="abrirModalAtendimento()">
                        <i class="fa-solid fa-users"></i> Atendimento Geral
                    </button>
                </div>
                <div class="ocorrencias-list" id="listaAgendamentos"></div>
            </div>
        </div>
    </div>

    <!-- Modal Nova Ocorrencia -->
    <div id="modalNovaOcorrencia" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1001;">
        <div class="form-container fade-in" style="margin-top: 5rem; position: relative;">
            <i class="fa-solid fa-times" style="position: absolute; right: 20px; top: 20px; cursor: pointer; font-size: 1.5rem;" onclick="document.getElementById('modalNovaOcorrencia').style.display='none'"></i>
            <h3 style="margin-bottom: 1.5rem;">Registrar Problema</h3>
            <form id="formOcorrencia">
                <div class="form-group">
                    <label>Título</label>
                    <input type="text" id="oc_titulo" required>
                </div>
                <div class="form-group">
                    <label>Secretaria Responsável</label>
                    <select id="oc_secretaria" required>
                        <option value="">Carregando...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Descrição Detalhada</label>
                    <textarea id="oc_descricao" rows="4" required></textarea>
                </div>
                <div class="form-group">
                    <label>Foto (Opcional)</label>
                    <input type="file" id="oc_foto" accept="image/*">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Enviar</button>
            </form>
        </div>
    </div>

    <!-- Modal Novo Agendamento -->
    <div id="modalNovoAgendamento" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1001; overflow-y:auto;">
        <div class="form-container fade-in" style="margin-top: 5rem; margin-bottom: 5rem; position: relative;">
            <i class="fa-solid fa-times" style="position: absolute; right: 20px; top: 20px; cursor: pointer; font-size: 1.5rem;" onclick="document.getElementById('modalNovoAgendamento').style.display='none'"></i>
            <h3 id="modalAgTitle" style="margin-bottom: 1.5rem;">Agendamento</h3>
            <form id="formAgendamento">
                <div class="form-group">
                    <label>Secretaria (Destino do Agendamento)</label>
                    <select id="ag_secretaria" required>
                        <option value="">Carregando...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Tipo de Atendimento</label>
                    <select id="ag_tipo" required>
                        <option value="">Selecione...</option>
                        <option value="Consulta Presencial">Consulta Presencial</option>
                    </select>
                </div>
                <div class="form-group" id="group_posto" style="display: none;">
                    <label>Posto de Saúde</label>
                    <select id="ag_posto">
                        <option value="">Selecione o posto...</option>
                        <option value="POSTO JOSÉ LUIZ LESSA (PSF 01)">POSTO JOSÉ LUIZ LESSA (PSF 01)</option>
                        <option value="POSTO CENTRO (PSF 02)">POSTO CENTRO (PSF 02)</option>
                        <option value="POSTO VILA NOVA (PSF 03)">POSTO VILA NOVA (PSF 03)</option>
                        <option value="POSTO DANIEL MONTEIRO DA CRUZ (PSF 04)">POSTO DANIEL MONTEIRO DA CRUZ (PSF 04)</option>
                        <option value="POSTO DE SAÚDE USINA TAQUARA (PSF 05)">POSTO DE SAÚDE USINA TAQUARA (PSF 05)</option>
                        <option value="POSTO BELO JARDIM (PSF 06)">POSTO BELO JARDIM (PSF 06)</option>
                        <option value="POSTO JOSÉ ADAMOR COSTA (PSF 07)">POSTO JOSÉ ADAMOR COSTA (PSF 07)</option>
                        <option value="POSTO JOSÉ ACIOLY MACIEL (PSF 08)">POSTO JOSÉ ACIOLY MACIEL (PSF 08)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label id="ag_assunto_label">Assunto</label>
                    <input type="text" id="ag_assunto" placeholder="" required>
                </div>
                <div class="form-group">
                    <label>Data e Hora Desejada (atendimento das 08:00 às 12:00)</label>
                    <input type="datetime-local" id="ag_data" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; background: var(--success);">Confirmar Agendamento</button>
            </form>
        </div>
    </div>

    <script src="js/main.js"></script>
    <script>
        if (!checkAuth()) throw new Error("Acesso negado");

        function abrirModalConsulta() {
            document.getElementById('modalNovoAgendamento').style.display = 'block';
            document.getElementById('modalAgTitle').innerText = 'Marcar Consulta (Saúde)';
            
            const tipoSelect = document.getElementById('ag_tipo');
            tipoSelect.innerHTML = `<option value="Consulta Presencial">Consulta Presencial</option>`;
            tipoSelect.value = "Consulta Presencial";

            const secSelect = document.getElementById('ag_secretaria');
            for(let i=0; i<secSelect.options.length; i++) {
                if(secSelect.options[i].text.toUpperCase().includes("SAÚDE")) {
                    secSelect.options[i].style.display = 'block';
                    secSelect.selectedIndex = i;
                } else {
                    secSelect.options[i].style.display = 'none';
                }
            }
            secSelect.disabled = true; // Força para a Secretaria de Saúde

            document.getElementById('ag_assunto_label').innerText = 'Assunto (Qual médico deseja agendar? E o Motivo?)';
            document.getElementById('ag_assunto').placeholder = 'Ex: Consulta com Clínico Geral, Pediatra, etc.';
            
            document.getElementById('group_posto').style.display = 'block';
            document.getElementById('ag_posto').required = true;
        }

        function abrirModalAtendimento() {
            document.getElementById('modalNovoAgendamento').style.display = 'block';
            document.getElementById('modalAgTitle').innerText = 'Agendar Atendimento Presencial';
            
            const tipoSelect = document.getElementById('ag_tipo');
            tipoSelect.innerHTML = `
                <option value="">Selecione...</option>
                <option value="Atendimento Presencial">Atendimento Presencial</option>
            `;

            const secSelect = document.getElementById('ag_secretaria');
            secSelect.disabled = false;
            for(let i=0; i<secSelect.options.length; i++) {
                secSelect.options[i].style.display = 'block';
            }
            secSelect.value = "";

            document.getElementById('ag_assunto_label').innerText = 'Assunto (Para qual assunto/secretário deseja agendar?)';
            document.getElementById('ag_assunto').placeholder = 'Ex: Reunião sobre alvará, Falar com Secretário de Obras, etc.';
            
            document.getElementById('group_posto').style.display = 'none';
            document.getElementById('ag_posto').required = false;
        }

        async function loadSecretarias() {
            try {
                const res = await fetch(`${API_URL}/secretarias/`);
                if(res.ok) {
                    const secs = await res.json();
                    const select = document.getElementById('oc_secretaria');
                    const selectAg = document.getElementById('ag_secretaria');
                    select.innerHTML = '<option value="">Selecione...</option>';
                    if(selectAg) selectAg.innerHTML = '<option value="">Selecione...</option>';
                    secs.forEach(s => {
                        select.innerHTML += `<option value="${s.id}">${s.nome}</option>`;
                        if(selectAg) selectAg.innerHTML += `<option value="${s.id}">${s.nome}</option>`;
                    });
                }
            } catch(e) {}
        }

        async function loadOcorrencias() {
            try {
                const res = await fetch(`${API_URL}/ocorrencias/`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if(res.ok) {
                    const ocorrencias = await res.json();
                    const container = document.getElementById('listaOcorrencias');
                    container.innerHTML = '';
                    if(ocorrencias.length === 0) {
                        container.innerHTML = '<p>Você ainda não registrou nenhuma ocorrência.</p>';
                        return;
                    }
                    ocorrencias.forEach(o => {
                        const statusClass = {
                            'Pendente': 'status-pendente',
                            'Em atendimento': 'status-atendimento',
                            'Resolvido': 'status-resolvido'
                        }[o.status] || 'status-pendente';

                        container.innerHTML += `
                            <div class="ocorrencia-card">
                                <h3>${o.titulo}</h3>
                                <p style="color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1rem;">Data: ${new Date(o.data).toLocaleDateString()}</p>
                                <span class="status-badge ${statusClass}">${o.status}</span>
                                <p style="margin-top: 1rem;">${o.descricao}</p>
                                ${o.foto ? `<p><a href="${MEDIA_URL}/${o.foto}" target="_blank"><i class="fa-solid fa-image"></i> Ver Foto Anexa</a></p>` : ''}
                            </div>
                        `;
                    });
                }
            } catch (e) {}
        }

        document.getElementById('formOcorrencia').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('titulo', document.getElementById('oc_titulo').value);
            formData.append('descricao', document.getElementById('oc_descricao').value);
            formData.append('secretaria_id', document.getElementById('oc_secretaria').value);
            
            const fileInput = document.getElementById('oc_foto');
            if(fileInput.files.length > 0) {
                formData.append('foto', fileInput.files[0]);
            }

            try {
                const res = await fetch(`${API_URL}/ocorrencias/`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${getToken()}` },
                    body: formData
                });
                if(res.ok) {
                    alert('Ocorrência registrada!');
                    document.getElementById('modalNovaOcorrencia').style.display='none';
                    e.target.reset();
                    loadOcorrencias();
                } else {
                    alert('Erro ao registrar.');
                }
            } catch(e) { alert('Erro de conexao.'); }
        });

        async function loadAgendamentos() {
            try {
                const res = await fetch(`${API_URL}/agendamentos/`, {
                    headers: { 'Authorization': `Bearer ${getToken()}` }
                });
                if(res.ok) {
                    const agendamentos = await res.json();
                    const container = document.getElementById('listaAgendamentos');
                    container.innerHTML = '';
                    if(agendamentos.length === 0) {
                        container.innerHTML = '<p>Nenhum agendamento encontrado.</p>';
                        return;
                    }
                    agendamentos.forEach(a => {
                        const statusClass = {
                            'Pendente': 'status-pendente',
                            'Confirmado': 'status-resolvido',
                            'Cancelado': 'status-error' // Using a generic error color
                        }[a.status] || 'status-pendente';

                        container.innerHTML += `
                            <div class="ocorrencia-card" style="border-left: 4px solid var(--success);">
                                <h3><i class="fa-solid fa-calendar"></i> ${a.assunto}</h3>
                                <p style="color: var(--text-secondary); margin-bottom: 0.5rem;"><i class="fa-solid fa-laptop-medical"></i> Tipo: <strong>${a.tipo}</strong></p>
                                <p style="color: var(--text-secondary); margin-bottom: 1rem;"><i class="fa-regular fa-clock"></i> Para: ${new Date(a.data_hora).toLocaleString()}</p>
                                <span class="status-badge ${statusClass}">${a.status}</span>
                            </div>
                        `;
                    });
                }
            } catch (e) {}
        }

        document.getElementById('formAgendamento').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const dropdown = document.getElementById('ag_secretaria');
            const nomeSecretaria = dropdown.options[dropdown.selectedIndex].text;
            const tipoAtend = document.getElementById('ag_tipo').value;
            const dataInput = document.getElementById('ag_data').value;
            const dataObjeto = new Date(dataInput);
            
            const hora = dataObjeto.getHours();
            if (hora < 8 || hora >= 12) {
                alert("Horário de agendamento indisponível! O atendimento ocorre apenas entre 08:00 e 12:00.");
                return;
            }
            
            let assuntoFinal = document.getElementById('ag_assunto').value;
            if (document.getElementById('group_posto').style.display !== 'none') {
                const posto = document.getElementById('ag_posto').value;
                if (!posto) {
                    alert("Selecione um Posto de Saúde.");
                    return;
                }
                assuntoFinal = `[${posto}] ` + assuntoFinal;
            }

            const data = {
                secretaria_id: parseInt(dropdown.value),
                tipo: tipoAtend,
                assunto: assuntoFinal,
                data_hora: dataObjeto.toISOString()
            };

            try {
                const res = await fetch(`${API_URL}/agendamentos/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${getToken()}` },
                    body: JSON.stringify(data)
                });
                if(res.ok) {
                    alert('Agendamento solicitado com sucesso! Aguarde a confirmação da secretaria.');
                    document.getElementById('modalNovoAgendamento').style.display='none';
                    e.target.reset();
                    loadAgendamentos();
                } else {
                    alert('Erro ao agendar.');
                }
            } catch(e) { alert('Erro de conexao.'); }
        });

        loadSecretarias();
        loadOcorrencias();
        loadAgendamentos();
        initBackgroundAnimation('bg-animation');
    </script>

    <footer class="footer">
        <p>Todos direitos reservados ao Desenvolvedor Barbosa Nunes</p>
    </footer>
</body>
</html>
